services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: memory
      POSTGRES_PASSWORD: memory
      POSTGRES_DB: memory
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memory -d memory"]
      interval: 5s
      timeout: 3s
      retries: 12

  memory-api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://memory:memory@postgres:5432/memory
      MEMORY_STORAGE_ROOT: /data/memory
      KNOWLEDGE_GRAPH_ROOT: /app/knowledge_graph
      BACKUP_ROOT: /backups
      DEV_AUTH_ENABLED: "true"
      DEV_AUTH_ALLOW_SCOPE_OVERRIDE: "false"
      MEMORY_ALLOWED_ORIGINS: '["http://localhost:5173"]'
    ports:
      - "8000:8000"
    volumes:
      - memory-data:/data/memory
      - ./knowledge_graph:/app/knowledge_graph:ro
      - ./.local/backups:/backups
    command: uv run --no-sync uvicorn backend.app:app --host 0.0.0.0 --port 8000

  memory-worker:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://memory:memory@postgres:5432/memory
      MEMORY_STORAGE_ROOT: /data/memory
      KNOWLEDGE_GRAPH_ROOT: /app/knowledge_graph
      BACKUP_ROOT: /backups
      DEV_AUTH_ENABLED: "true"
    volumes:
      - memory-data:/data/memory
      - ./knowledge_graph:/app/knowledge_graph:ro
      - ./.local/backups:/backups
    command: uv run --no-sync python -m backend.memory.worker.main

  memory-scheduler:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://memory:memory@postgres:5432/memory
      MEMORY_STORAGE_ROOT: /data/memory
      KNOWLEDGE_GRAPH_ROOT: /app/knowledge_graph
      BACKUP_ROOT: /backups
      MEMORY_SCHEDULER_TIMEZONE: Asia/Shanghai
    volumes:
      - memory-data:/data/memory
      - ./knowledge_graph:/app/knowledge_graph:ro
      - ./.local/backups:/backups
    command: uv run --no-sync python -m backend.memory.worker.scheduler

  memory-outbox-consumer:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://memory:memory@postgres:5432/memory
      MEMORY_STORAGE_ROOT: /data/memory
      KNOWLEDGE_GRAPH_ROOT: /app/knowledge_graph
      BACKUP_ROOT: /backups
    volumes:
      - memory-data:/data/memory
      - ./knowledge_graph:/app/knowledge_graph:ro
      - ./.local/backups:/backups
    command: uv run --no-sync python -m backend.memory.worker.outbox_consumer

  frontend:
    profiles: ["frontend"]
    build:
      context: ./frontend
    ports:
      - "4173:4173"
    depends_on:
      - memory-api

volumes:
  postgres-data:
  memory-data:
