services:
  postgres:
    image: postgres:17
    environment:
      # 管理员账号仅用于初始化与运维（方案 §6.1 / 附录 A.1 #2），不进入应用配置；
      # 应用使用最小权限的 memory / auth 账号（见 initdb 脚本）。
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # 全新 volume 首次启动自动执行三账号初始化；存量 volume 需手动执行
      # scripts/postgres_roles_upgrade.sh（幂等，不删除任何数据）
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memory -d memory"]
      interval: 5s
      timeout: 3s
      retries: 12

  memory-api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://memory:memory@postgres:5432/memory
      MEMORY_STORAGE_ROOT: /data/memory
      KNOWLEDGE_GRAPH_ROOT: /app/knowledge_graph
      BACKUP_ROOT: /backups
      DEV_AUTH_ENABLED: "true"
      DEV_AUTH_ALLOW_SCOPE_OVERRIDE: "true"
      MEMORY_ALLOWED_ORIGINS: '["http://localhost:5173"]'
      OPENAI_API_KEY: ${OPENAI_API_KEY:-${DEEPSEEK_API_KEY:-}}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-${DEEPSEEK_BASE_URL:-}}
      OPENAI_MEMORY_MODEL: ${OPENAI_MEMORY_MODEL:-${DEEPSEEK_MODEL:-gpt-5.6-luna}}
      OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-none}
    ports:
      # 评审 #9：仅绑定 loopback，Dev Auth 不暴露到局域网
      - "127.0.0.1:8001:8000"
    volumes:
      - memory-data:/data/memory
      - ./knowledge_graph:/app/knowledge_graph:ro
      - ./.local/backups:/backups
    command: uv run --no-sync uvicorn backend.app:app --host 0.0.0.0 --port 8000

  memory-worker:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://memory:memory@postgres:5432/memory
      MEMORY_STORAGE_ROOT: /data/memory
      KNOWLEDGE_GRAPH_ROOT: /app/knowledge_graph
      BACKUP_ROOT: /backups
      DEV_AUTH_ENABLED: "true"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-${DEEPSEEK_API_KEY:-}}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-${DEEPSEEK_BASE_URL:-}}
      OPENAI_MEMORY_MODEL: ${OPENAI_MEMORY_MODEL:-${DEEPSEEK_MODEL:-gpt-5.6-luna}}
      OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-none}
    volumes:
      - memory-data:/data/memory
      - ./knowledge_graph:/app/knowledge_graph:ro
      - ./.local/backups:/backups
    command: uv run --no-sync python -m backend.memory.worker.main

  memory-scheduler:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://memory:memory@postgres:5432/memory
      MEMORY_STORAGE_ROOT: /data/memory
      KNOWLEDGE_GRAPH_ROOT: /app/knowledge_graph
      BACKUP_ROOT: /backups
      MEMORY_SCHEDULER_TIMEZONE: Asia/Shanghai
    volumes:
      - memory-data:/data/memory
      - ./knowledge_graph:/app/knowledge_graph:ro
      - ./.local/backups:/backups
    command: uv run --no-sync python -m backend.memory.worker.scheduler

  memory-outbox-consumer:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://memory:memory@postgres:5432/memory
      MEMORY_STORAGE_ROOT: /data/memory
      KNOWLEDGE_GRAPH_ROOT: /app/knowledge_graph
      BACKUP_ROOT: /backups
    volumes:
      - memory-data:/data/memory
      - ./knowledge_graph:/app/knowledge_graph:ro
      - ./.local/backups:/backups
    command: uv run --no-sync python -m backend.memory.worker.outbox_consumer

  frontend:
    profiles: ["frontend"]
    build:
      context: ./frontend
    ports:
      # 评审 #9：仅绑定 loopback
      - "127.0.0.1:4173:4173"
    depends_on:
      - memory-api

volumes:
  postgres-data:
  memory-data:
