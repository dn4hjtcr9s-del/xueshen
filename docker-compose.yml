services:
  postgres:
    image: postgres:17
    environment:
      # 管理员账号仅用于初始化与运维（方案 §6.1 / 附录 A.1 #2），不进入应用配置；
      # 应用使用最小权限的 memory / auth 账号（见 initdb 脚本）。
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # 全新 volume 首次启动自动执行四账号初始化；存量 volume 需手动执行
      # scripts/postgres_roles_upgrade.sh（幂等，不删除任何数据）
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Community 库由应用 readiness 检查兜底（§13.1 D25），此处仅探测 postgres 就绪
      test: ["CMD-SHELL", "pg_isready -U memory -d memory"]
      interval: 5s
      timeout: 3s
      retries: 12

  memory-api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://memory:memory@postgres:5432/memory
      MEMORY_STORAGE_ROOT: /data/memory
      KNOWLEDGE_GRAPH_ROOT: /app/knowledge_graph
      BACKUP_ROOT: /backups
      DEV_AUTH_ENABLED: "true"
      DEV_AUTH_ALLOW_SCOPE_OVERRIDE: "true"
      # 评审 P2-11：4173 为 vite preview 过渡期 origin（方案 §9.4）
      MEMORY_ALLOWED_ORIGINS: '["http://localhost:5173", "http://localhost:4173"]'
      OPENAI_API_KEY: ${OPENAI_API_KEY:-${DEEPSEEK_API_KEY:-}}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-${DEEPSEEK_BASE_URL:-}}
      OPENAI_MEMORY_MODEL: ${OPENAI_MEMORY_MODEL:-${DEEPSEEK_MODEL:-gpt-5.6-luna}}
      OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-none}
      # Conversation API 与 Memory API 同进程挂载，必须显式使用容器内数据库地址。
      CONVERSATION_DATABASE_URL: postgresql+psycopg://conversation:conversation@postgres:5432/conversation
      OPENAI_REWRITE_MODEL: ${OPENAI_REWRITE_MODEL:-${OPENAI_MEMORY_MODEL:-${DEEPSEEK_MODEL:-}}}
      OPENAI_EVIDENCE_MODEL: ${OPENAI_EVIDENCE_MODEL:-${OPENAI_MEMORY_MODEL:-${DEEPSEEK_MODEL:-}}}
      OPENAI_ANSWER_MODEL: ${OPENAI_ANSWER_MODEL:-${OPENAI_MEMORY_MODEL:-${DEEPSEEK_MODEL:-}}}
      OPENAI_CONVERSATION_SUMMARY_MODEL: ${OPENAI_CONVERSATION_SUMMARY_MODEL:-${OPENAI_MEMORY_MODEL:-${DEEPSEEK_MODEL:-}}}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-${DASHSCOPE_API_KEY:-}}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      RAG_EMBEDDING_DIMENSIONS: ${RAG_EMBEDDING_DIMENSIONS:-1024}
      # 认证服务（方案 §6.2 / 附录 A.1 #6）：仅 memory-api 持有私钥并验签
      AUTH_DATABASE_URL: postgresql+psycopg://auth:auth@postgres:5432/auth
      AUTH_ISSUER: gewu-auth
      AUTH_PRIVATE_KEY_FILE: /secrets/auth_private.pem
      AUTH_PUBLIC_KEY_FILE: /secrets/auth_public.pem
      # Community 社区（方案 community-implementation-plan.md §4.2/§13.2）：
      # Community API 内嵌本服务；未配置时路由不挂载、readiness 不报错（D25）。
      COMMUNITY_DATABASE_URL: postgresql+psycopg://community:community@postgres:5432/community
      # §13.2：Memory runtime 经内部 Reader 读社区来源；token 由部署注入
      COMMUNITY_READER_BASE_URL: http://memory-api:8000
      COMMUNITY_READER_SERVICE_TOKEN: ${COMMUNITY_READER_SERVICE_TOKEN:-}
      COMMUNITY_SOURCE_DELETE_SERVICE_TOKEN: ${COMMUNITY_SOURCE_DELETE_SERVICE_TOKEN:-}
      COMMUNITY_ACCOUNT_PURGE_SERVICE_TOKEN: ${COMMUNITY_ACCOUNT_PURGE_SERVICE_TOKEN:-}
      # 灰度（§10.1/D7：默认关闭，按 deletion→evidence 顺序开启）
      COMMUNITY_PUBLISHER_ENABLED: "false"
      COMMUNITY_MEMORY_SUBMIT_ENABLED: "false"
      COMMUNITY_SOURCE_DELETION_ENABLED: "false"
    ports:
      # 评审 #9：仅绑定 loopback，Dev Auth 不暴露到局域网
      - "127.0.0.1:8001:8000"
    volumes:
      - memory-data:/data/memory
      - ./knowledge_graph:/app/knowledge_graph:ro
      - ./.local/backups:/backups
      # 密钥只读挂载（附录 A.1 #6）；本地由 scripts/generate_auth_keys.sh 生成
      - ./.local/keys:/secrets:ro
    command: uv run --no-sync uvicorn backend.app:app --host 0.0.0.0 --port 8000

  memory-worker:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://memory:memory@postgres:5432/memory
      MEMORY_STORAGE_ROOT: /data/memory
      KNOWLEDGE_GRAPH_ROOT: /app/knowledge_graph
      BACKUP_ROOT: /backups
      DEV_AUTH_ENABLED: "true"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-${DEEPSEEK_API_KEY:-}}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-${DEEPSEEK_BASE_URL:-}}
      OPENAI_MEMORY_MODEL: ${OPENAI_MEMORY_MODEL:-${DEEPSEEK_MODEL:-gpt-5.6-luna}}
      OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-none}
      # §13.2：worker 与 memory-api 使用同一内部 Reader URL 与 token，
      # 不能让 worker 留在 _UnavailableActivityReader
      COMMUNITY_READER_BASE_URL: http://memory-api:8000
      COMMUNITY_READER_SERVICE_TOKEN: ${COMMUNITY_READER_SERVICE_TOKEN:-}
    volumes:
      - memory-data:/data/memory
      - ./knowledge_graph:/app/knowledge_graph:ro
      - ./.local/backups:/backups
    command: uv run --no-sync python -m backend.memory.worker.main

  memory-scheduler:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://memory:memory@postgres:5432/memory
      MEMORY_STORAGE_ROOT: /data/memory
      KNOWLEDGE_GRAPH_ROOT: /app/knowledge_graph
      BACKUP_ROOT: /backups
      MEMORY_SCHEDULER_TIMEZONE: Asia/Shanghai
      # 附录 A.1 #6：scheduler 只做 refresh family 数据清理，仅需 AUTH_DATABASE_URL
      AUTH_DATABASE_URL: postgresql+psycopg://auth:auth@postgres:5432/auth
    volumes:
      - memory-data:/data/memory
      - ./knowledge_graph:/app/knowledge_graph:ro
      - ./.local/backups:/backups
    command: uv run --no-sync python -m backend.memory.worker.scheduler

  memory-outbox-consumer:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://memory:memory@postgres:5432/memory
      MEMORY_STORAGE_ROOT: /data/memory
      KNOWLEDGE_GRAPH_ROOT: /app/knowledge_graph
      BACKUP_ROOT: /backups
    volumes:
      - memory-data:/data/memory
      - ./knowledge_graph:/app/knowledge_graph:ro
      - ./.local/backups:/backups
    command: uv run --no-sync python -m backend.memory.worker.outbox_consumer

  # Conversation Agentic RAG（方案 §5.4 / 附录 A.9）：
  # 两个独立运行时角色，不发布端口；与 memory-api 同网络。
  conversation-worker:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: development
      CONVERSATION_DATABASE_URL: postgresql+psycopg://conversation:conversation@postgres:5432/conversation
      DATABASE_URL: postgresql+psycopg://memory:memory@postgres:5432/memory
      MEMORY_STORAGE_ROOT: /data/memory
      KNOWLEDGE_GRAPH_ROOT: /app/knowledge_graph
      DEV_AUTH_ENABLED: "true"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-${DEEPSEEK_API_KEY:-}}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-${DEEPSEEK_BASE_URL:-}}
      OPENAI_REWRITE_MODEL: ${OPENAI_REWRITE_MODEL:-${OPENAI_MEMORY_MODEL:-${DEEPSEEK_MODEL:-}}}
      OPENAI_EVIDENCE_MODEL: ${OPENAI_EVIDENCE_MODEL:-${OPENAI_MEMORY_MODEL:-${DEEPSEEK_MODEL:-}}}
      OPENAI_ANSWER_MODEL: ${OPENAI_ANSWER_MODEL:-${OPENAI_MEMORY_MODEL:-${DEEPSEEK_MODEL:-}}}
      OPENAI_CONVERSATION_SUMMARY_MODEL: ${OPENAI_CONVERSATION_SUMMARY_MODEL:-${OPENAI_MEMORY_MODEL:-${DEEPSEEK_MODEL:-}}}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-${DASHSCOPE_API_KEY:-}}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      RAG_EMBEDDING_DIMENSIONS: ${RAG_EMBEDDING_DIMENSIONS:-1024}
      # RAG 数据库保持独立部署；容器通过宿主机已发布的 55433 端口访问。
      RAG_DATABASE_URL: ${RAG_DATABASE_URL_DOCKER:-postgresql+psycopg://rag:rag@host.docker.internal:55433/rag}
      MEMORY_API_BASE_URL: http://memory-api:8000
      MEMORY_AGENT_TOKEN: ${MEMORY_AGENT_TOKEN:-}
    volumes:
      - memory-data:/data/memory
      - ./knowledge_graph:/app/knowledge_graph:ro
    command: uv run --no-sync python -m backend.conversation.worker.main

  conversation-outbox-publisher:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: development
      CONVERSATION_DATABASE_URL: postgresql+psycopg://conversation:conversation@postgres:5432/conversation
      DATABASE_URL: postgresql+psycopg://memory:memory@postgres:5432/memory
      DEV_AUTH_ENABLED: "true"
      MEMORY_API_BASE_URL: http://memory-api:8000
      MEMORY_AGENT_TOKEN: ${MEMORY_AGENT_TOKEN:-}
    command: uv run --no-sync python -m backend.conversation.publisher.main

  frontend:
    profiles: ["frontend"]
    build:
      context: ./frontend
    ports:
      # 评审 #9：仅绑定 loopback
      - "127.0.0.1:4173:4173"
    environment:
      # 评审 P1-3：容器内 localhost 指向自身；代理必须指向 memory-api 服务
      MEMORY_DEV_API_TARGET: http://memory-api:8000
    depends_on:
      - memory-api

volumes:
  postgres-data:
  memory-data:
