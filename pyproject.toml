[project]
name = "gewu-math-memory"
version = "0.1.0"
description = "MemoryManagerGraph: 长期记忆与知识图谱状态服务"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.116,<1.0",
    "uvicorn>=0.47,<0.48",
    "pydantic>=2.13,<3.0",
    "pydantic-settings>=2.10,<3.0",
    "sqlalchemy>=2.0.49,<2.1",
    "greenlet>=3.1,<4.0",
    "alembic>=1.16,<2.0",
    "psycopg[binary,pool]>=3.2,<4.0",
    "langgraph==1.2.1",
    "langgraph-checkpoint==4.1.0",
    "langgraph-checkpoint-postgres==3.0.4",
    "openai>=2.38,<3",
    "prometheus-client>=0.22,<1",
    "pyjwt[crypto]>=2.10,<3.0",
    "httpx>=0.28,<1.0",
    "bcrypt>=4.2,<6.0",
    # 附录 A.7（v1.4）：TokenCounter 全链路统一 tiktoken o200k_base，主依赖必需
    "tiktoken>=0.11,<1",
]

[project.optional-dependencies]
ocr = ["pypdf>=6,<7"]
dev = [
    "pytest>=9.0,<10.0",
    "pytest-asyncio>=1.1,<2.0",
    "ruff>=0.12,<1.0",
    "mypy>=1.17,<2.0",
    "testcontainers[postgres]>=4.10,<5.0",
]
embedding = [
    "tiktoken>=0.11,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
# 代码注释与 docstring 使用中文全角标点属于有意为之，关闭歧义字符检查
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# FastAPI 依赖注入工厂模式（Depends(require(...))/Depends(rate_limit(...))）是
# 框架标准用法，B008 函数调用默认值在此为有意为之
"backend/memory/api/**" = ["B008"]
"backend/conversation/api/**" = ["B008"]
"backend/shared/auth_context.py" = ["B008"]
"backend/community/api/**" = ["B008"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "."

[[tool.mypy.overrides]]
module = ["langgraph.*", "langgraph_checkpoint.*", "testcontainers.*"]
ignore_missing_imports = true

# LangGraph StateGraph 泛型与 Send 动态节点类型无法在 strict 模式精确表达，
# 与对 langgraph 包的忽略处理一致；builder 只做图装配，不含业务逻辑
[[tool.mypy.overrides]]
module = ["backend.conversation.graph.builder"]
disable_error_code = ["type-var", "arg-type", "type-arg", "no-any-return", "misc", "attr-defined"]
