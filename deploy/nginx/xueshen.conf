# xueshen.xin 生产站点配置（宿主机 nginx，community-rebuild-plan.md 5.3 冻结项适配版）。
#
# 安装方式（root）：
#   cp deploy/nginx/xueshen.conf /etc/nginx/sites-available/xueshen
#   ln -sf /etc/nginx/sites-available/xueshen /etc/nginx/sites-enabled/xueshen
#   rm -f /etc/nginx/sites-enabled/default
#   nginx -t && systemctl reload nginx
#
# 与计划 5.3 的关系：计划按容器化 nginx 撰写；实际部署为宿主机 nginx（已持有
# certbot 证书 + certbot.timer 自动续期），路由规则逐条对应：
#   /api/ → memory-api:8000（不去前缀，auth/conversation 端点）
#   /memory-api/ → memory-api:8000（去前缀，memory/community 业务端点）
#   SSE 路由 proxy_buffering off + proxy_read_timeout 3600s
#   community/uploads 独立 location proxy_read_timeout 480s（≥ 上传上限 420s + 余量）
#   client_max_body_size 8m；/ 前端静态 try_files 兜底；/health/ready 不对外暴露

# 80 端口：certbot 续期 webroot + 其余强制跳 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name xueshen.xin www.xueshen.xin;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name xueshen.xin www.xueshen.xin;

    # certbot 管理（certbot.timer 自动续期，续期后 certbot 自动 reload nginx）
    ssl_certificate     /etc/letsencrypt/live/xueshen.xin/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xueshen.xin/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /opt/xueshen/frontend/dist;
    index index.html;

    # 首屏性能审计 P2-6：gzip 压缩。nginx 默认 gzip_types 只含 text/html，
    # 914 KB 的 JS/CSS 原样传输（gzip 后约 1/3）。
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/css
        text/plain
        application/javascript
        application/json
        image/svg+xml
        application/manifest+json;
    # brotli 压缩率更高，但需宿主机安装 ngx_brotli 动态模块后才能启用：
    #   brotli on;
    #   brotli_comp_level 5;
    #   brotli_types text/css text/plain application/javascript application/json image/svg+xml;

    # 首屏性能审计 P2-6：带内容哈希的 /assets/* 长缓存，免于每次重新验证；
    # HTML 入口不缓存，保证发版后立刻拿到引用新哈希的 index.html。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 上传上限 8m（应用层单图 ≤ 5MiB + multipart 开销，计划 5.3 冻结）
    client_max_body_size 8m;

    # 通用反代头
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 社区配图上传：应用层上传超时上限 420s + 余量（计划 5.3/§7.11 冻结）
    location /memory-api/api/v1/community/uploads {
        proxy_pass http://127.0.0.1:8000/api/v1/community/uploads;
        proxy_read_timeout 480s;
        proxy_send_timeout 480s;
    }

    # Conversation SSE 事件流：禁缓冲、禁缓存、长超时（计划 5.3 冻结）
    location ~ ^/api/v1/conversations/.+/turns/.+/events$ {
        proxy_pass http://127.0.0.1:8000;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # /api/v1 直连（auth 登录/刷新、conversation 等，路径不去前缀）
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
    }

    # /memory-api 前缀剥除后转发（memory/community 业务接口，与 vite dev 代理同构）
    location /memory-api/ {
        proxy_pass http://127.0.0.1:8000/;
    }

    # 前端 SPA 兜底
    location / {
        try_files $uri /index.html;
    }

    # /health/ready 不对外暴露（无 location 匹配，落 SPA 兜底返回 index.html 而非健康信息；
    # 就绪探测在服务器本机执行：curl http://127.0.0.1:8000/health/ready）
}
