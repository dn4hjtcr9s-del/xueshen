# MemoryManagerGraph 前端容器内静态服务配置（首屏性能审计 P3）。
# 与生产宿主机 nginx（deploy/nginx/xueshen.conf）静态服务策略一致：
# gzip、/assets 长缓存、index.html no-cache、SPA 兜底、API 反代。
# 注意：反代上游使用 compose 网络服务名 memory-api，脱离 compose 运行时
# 该 location 无法解析上游（与生产"宿主机 nginx 反代本机 8000"同构取舍）。

server {
    listen 80;
    server_name _;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/css
        text/plain
        application/javascript
        application/json
        image/svg+xml
        application/manifest+json;

    root /usr/share/nginx/html;
    index index.html;

    # 带内容哈希的静态资源：长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    # 与生产宿主机配置对齐：/ 入口同样 no-cache（try_files 兜底不匹配精确块）
    location = / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    # Conversation SSE 事件流：禁缓冲、长超时（与生产配置一致）
    location ~ ^/api/v1/conversations/.+/turns/.+/events$ {
        proxy_pass http://memory-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # /api/v1 直连（auth 登录/刷新等，路径不去前缀）
    location /api/ {
        proxy_pass http://memory-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /memory-api 前缀剥除后转发（memory/community 业务接口）
    location /memory-api/ {
        proxy_pass http://memory-api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 前端 SPA 兜底
    location / {
        try_files $uri /index.html;
    }
}
